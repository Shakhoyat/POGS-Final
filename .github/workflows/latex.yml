name: Compile LaTeX (check only; PDFs are built locally with tools/build_tex.sh and committed)
on:
  push:
    paths:
      - "docs/report/**.tex"
      - "docs/paper_draft/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        doc: [{dir: docs/report, root: progress_report.tex}, {dir: docs/paper_draft, root: main.tex}]
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.doc.root }}
          working_directory: ${{ matrix.doc.dir }}
